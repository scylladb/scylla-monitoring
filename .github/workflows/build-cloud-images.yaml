name: Build Cloud Images

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      monitor_version:
        description: 'Git tag to build from'
        required: true
      arch:
        description: 'Architecture to build'
        type: choice
        options: [all, amd64, arm64]
        default: all
      cloud:
        description: 'Cloud to build on'
        type: choice
        options: [all, aws, gce]
        default: all
      gcp_zone:
        description: 'GCE build zone (empty: template default)'
        required: false
      aws_ami_regions:
        description: 'Comma separated AWS regions to copy the AMI to (empty: all production regions)'
        required: false
      name_tag:
        description: 'Replaces the version part of the image name, e.g. 4.17.0-rc1-test (empty: monitor_version)'
        required: false
      ref:
        description: 'Git ref to check out for packer/ (empty: the monitor_version tag)'
        required: false
      test:
        description: 'Test build: no public AWS sharing, no GCE image family'
        type: boolean
        default: false

jobs:
  build-cloud-images:
    runs-on: ubuntu-latest

    permissions:
      contents: 'write'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          # Build from the tag, not from the branch head: packer/files scripts
          # must match the monitoring tarball they install.
          # A test build may check out a branch with `ref`.
          ref: ${{ github.event.inputs.ref || github.event.inputs.monitor_version }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3.0.0
        with:
          version: '1.10.0'

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MONITOR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MONITOR_AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-east-1'

      - name: Setup GCP credentials
        uses: google-github-actions/auth@v2.1.2
        with:
          workload_identity_provider: ${{ secrets.MONITOR_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.MONITOR_GCP_SERVICE_ACCOUNT }}

      - name: Determine Scylla Monitor version
        run: |
          if ${{ github.event_name == 'workflow_dispatch' }}; then
            MONITOR_VERSION="${{ github.event.inputs.monitor_version }}"
          elif ${{ github.event_name == 'release' }}; then
            MONITOR_VERSION="${{ github.event.release.tag_name }}"
          else
            echo "Missing Scylla Monitor version - Workflow cannot continue"
            exit 1
          fi
          # Version line for the `branch` tag, e.g. 4.16.0-rc0 -> 4.16 (raw version if no X.Y match)
          MONITOR_BRANCH="$(echo "$MONITOR_VERSION" | sed -E 's/^[^0-9]*([0-9]+\.[0-9]+).*/\1/')"
          echo "MONITOR_VERSION=$MONITOR_VERSION" >> $GITHUB_ENV
          echo "MONITOR_BRANCH=$MONITOR_BRANCH" >> $GITHUB_ENV

      - name: Build Images
        env:
          ARCH: ${{ github.event.inputs.arch || 'all' }}
          CLOUD: ${{ github.event.inputs.cloud || 'all' }}
          GCP_ZONE: ${{ github.event.inputs.gcp_zone }}
          AWS_AMI_REGIONS: ${{ github.event.inputs.aws_ami_regions }}
          NAME_TAG: ${{ github.event.inputs.name_tag }}
          TEST: ${{ github.event.inputs.test || 'false' }}
        run: |
          packer plugins install github.com/hashicorp/googlecompute
          packer plugins install github.com/hashicorp/amazon
          args=(-var monitor_version="$MONITOR_VERSION" -var monitor_branch="$MONITOR_BRANCH")
          case "$CLOUD" in
            aws) args+=(-only=amazon-ebs) ;;
            gce) args+=(-only=googlecompute) ;;
          esac
          if [ -n "$GCP_ZONE" ]; then args+=(-var gcp_zone="$GCP_ZONE"); fi
          if [ -n "$AWS_AMI_REGIONS" ]; then args+=(-var aws_ami_regions="$AWS_AMI_REGIONS"); fi
          if [ -n "$NAME_TAG" ]; then args+=(-var monitor_name_tag="$NAME_TAG"); fi
          tpl=scylla-monitor-template.json
          if [ "$TEST" = true ]; then
            # Test images: not public on AWS, not in a GCE image family
            jq '(.builders[] | select(.type=="amazon-ebs")) |= del(.ami_groups, .snapshot_groups)
              | (.builders[] | select(.type=="googlecompute")) |= del(.image_family)' "$tpl" > test-template.json
            tpl=test-template.json
          fi
          archs="amd64 arm64"
          if [ "$ARCH" != all ]; then archs="$ARCH"; fi
          for a in $archs; do
            packer build "${args[@]}" -var arch="$a" "$tpl"
          done
        working-directory: packer

      - name: List images in the job summary
        run: |
          echo "### Cloud images for $MONITOR_VERSION" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.builds[] | "- \(.builder_type) \(.custom_data.arch): `\(.artifact_id)`"' packer/packer-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Archive Packer manifest
        uses: actions/upload-artifact@v4
        with:
          name: scylla-monitor-cloud-images-${{ env.MONITOR_VERSION }}
          path: packer/packer-manifest.json

      - name: Upload Packer manifest to the release
        if: github.event_name == 'release' && github.event.release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: packer/packer-manifest.json
          asset_name: scylla-monitor-cloud-images-${{ env.MONITOR_VERSION }}.json
          asset_content_type: application/json

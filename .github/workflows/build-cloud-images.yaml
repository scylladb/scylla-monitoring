name: Build Cloud Images

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      monitor_version:
        description: 'Git tag to build from'
        required: true
      archs:
        description: 'Archs to build, space separated (amd64 arm64). Empty = all'
        required: false
      clouds:
        description: 'Clouds to build, space separated (aws gcp). Empty = all'
        required: false
      aws_regions:
        description: 'AWS regions to copy the AMI to, comma separated. Empty = template default'
        required: false

jobs:
  build-cloud-images:
    runs-on: ubuntu-latest

    permissions:
      contents: 'write'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          # Build from the tag, not from the branch head: packer/files scripts
          # must match the monitoring tarball they install.
          ref: ${{ github.event.inputs.monitor_version }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3.0.0
        with:
          version: '1.10.0'

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MONITOR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MONITOR_AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-east-1'

      - name: Setup GCP credentials
        uses: google-github-actions/auth@v2.1.2
        with:
          workload_identity_provider: ${{ secrets.MONITOR_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.MONITOR_GCP_SERVICE_ACCOUNT }}

      - name: Determine Scylla Monitor version
        run: |
          if ${{ github.event_name == 'workflow_dispatch' }}; then
            MONITOR_VERSION="${{ github.event.inputs.monitor_version }}"
          elif ${{ github.event_name == 'release' }}; then
            MONITOR_VERSION="${{ github.event.release.tag_name }}"
          else
            echo "Missing Scylla Monitor version - Workflow cannot continue"
            exit 1
          fi
          # Version line for the `branch` tag, e.g. 4.16.0-rc0 -> 4.16 (raw version if no X.Y match)
          MONITOR_BRANCH="$(echo "$MONITOR_VERSION" | sed -E 's/^[^0-9]*([0-9]+\.[0-9]+).*/\1/')"
          echo "MONITOR_VERSION=$MONITOR_VERSION" >> $GITHUB_ENV
          echo "MONITOR_BRANCH=$MONITOR_BRANCH" >> $GITHUB_ENV

      - name: Build Images
        env:
          ARCHS: ${{ github.event.inputs.archs }}
          CLOUDS: ${{ github.event.inputs.clouds }}
          AWS_REGIONS: ${{ github.event.inputs.aws_regions }}
        run: |
          packer plugins install github.com/hashicorp/googlecompute
          packer plugins install github.com/hashicorp/amazon
          # Inputs are word split below; do not expand globs like '*'
          set -f
          AWS_REGIONS="${AWS_REGIONS// /}"
          case ",$AWS_REGIONS," in
            ,,) ;;
            *,,*) echo "Empty entry in aws_regions: '$AWS_REGIONS'"; exit 1 ;;
          esac
          # A subset build must not be mistaken for the full release manifest
          if [ -n "$ARCHS$CLOUDS$AWS_REGIONS" ]; then
            echo "ARTIFACT_SUFFIX=-partial" >> "$GITHUB_ENV"
          fi
          # Check every arch before building anything; drop repeats
          ARCHS=$(printf '%s\n' ${ARCHS:-amd64 arm64} | sort -u)
          for arch in $ARCHS; do
            case $arch in
              amd64|arm64) ;;
              *) echo "Unknown arch: $arch"; exit 1 ;;
            esac
          done
          built=0
          for arch in $ARCHS; do
            only=""
            for cloud in ${CLOUDS:-aws gcp}; do
              case $cloud in
                aws) only+=amazon-ebs, ;;
                # No GCP arm64 image
                gcp) [ "$arch" = arm64 ] || only+=googlecompute, ;;
                *) echo "Unknown cloud: $cloud"; exit 1 ;;
              esac
            done
            [ -n "$only" ] || continue
            packer build -only="${only%,}" -var monitor_version="$MONITOR_VERSION" -var monitor_branch="$MONITOR_BRANCH" -var arch="$arch" \
              ${AWS_REGIONS:+-var aws_ami_regions="$AWS_REGIONS"} scylla-monitor-template.json
            built=1
          done
          if [ "$built" = 0 ]; then
            echo "Nothing to build for archs='$ARCHS' clouds='$CLOUDS'"
            exit 1
          fi
        working-directory: packer

      - name: List images in the job summary
        run: |
          echo "### Cloud images for $MONITOR_VERSION" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.builds[] | "- \(.builder_type) \(.custom_data.arch): `\(.artifact_id)`"' packer/packer-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Archive Packer manifest
        uses: actions/upload-artifact@v4
        with:
          name: scylla-monitor-cloud-images-${{ env.MONITOR_VERSION }}${{ env.ARTIFACT_SUFFIX }}
          path: packer/packer-manifest.json

      - name: Upload Packer manifest to the release
        if: github.event_name == 'release' && github.event.release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: packer/packer-manifest.json
          asset_name: scylla-monitor-cloud-images-${{ env.MONITOR_VERSION }}.json
          asset_content_type: application/json

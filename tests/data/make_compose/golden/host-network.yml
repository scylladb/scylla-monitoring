compose:
  name: scylla-monitoring
  services:
    aalert:
      container_name: aalert
      image: docker.io/prom/alertmanager:<ALERT_MANAGER_VERSION>
      volumes:
      - ./prometheus/rule_config.yml:/etc/alertmanager/config.yml:z
      command:
      - --log.level=debug
      - --config.file=/etc/alertmanager/config.yml
      network_mode: host
    loki:
      container_name: loki
      image: docker.io/grafana/loki:<LOKI_VERSION>
      volumes:
      - ./loki/rules/scylla:/etc/loki/rules/fake:z
      - ./loki/conf:/mnt/config:z
      command:
      - --ingester.wal-enabled=false
      - --config.file=/mnt/config/loki-config.yaml
      network_mode: host
    alloy:
      container_name: alloy
      image: docker.io/grafana/alloy:<ALLOY_VERSION>
      volumes:
      - ./loki/alloy/build:/etc/alloy/conf:ro,z
      command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/conf/config.alloy
      network_mode: host
    aprom:
      container_name: aprom
      image: docker.io/prom/prometheus:<PROMETHEUS_VERSION>
      volumes:
      - ./prometheus/build/:/etc/prometheus/config/:z
      - ./prometheus/prom_rules/:/etc/prometheus/prom_rules/:z
      - ./tests/data/make_compose/targets/:/etc/scylla.d/prometheus/targets/:z
      command:
      - --web.enable-lifecycle
      - --enable-feature=promql-experimental-functions
      - --config.file=/etc/prometheus/config/prometheus.yml
      network_mode: host
    agrafrender:
      container_name: agrafrender
      image: docker.io/grafana/grafana-image-renderer:<GRAFANA_RENDERER_VERSION>
      command:
      - server
      network_mode: host
      environment:
      - AUTH_TOKEN=${GRAFANA_RENDERER_TOKEN}
    agraf:
      container_name: agraf
      image: docker.io/grafana/grafana:<GRAFANA_VERSION>
      user: 1000:1000
      volumes:
      - ./grafana/build:/var/lib/grafana/dashboards:z
      - ./grafana/plugins:/var/lib/grafana/plugins:z
      - ./grafana/provisioning:/var/lib/grafana/provisioning:z
      environment:
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_RENDERING_DEFAULT_WIDTH=1920
      - GF_RENDERING_DEFAULT_HEIGHT=1080
      - GF_PATHS_PROVISIONING=/var/lib/grafana/provisioning
      - GF_ANALYTICS_GOOGLE_ANALYTICS_UA_ID=UA-43975320-9
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
      - GF_DATABASE_WAL=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=scylladb-scylla-datasource
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ver_2025.3/scylla-overview.2025.3.json
      - GF_PROVISIONING_PERMITTED_PROVISIONED_PATHS=/var/lib/grafana/dashboards/
      - GF_SERVER_ENABLE_GZIP=true
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_USERS_DEFAULT_THEME=light
      - GF_RENDERING_SERVER_URL=http://127.0.0.1:8081/render
      - GF_RENDERING_CALLBACK_URL=http://127.0.0.1:3000/
      - GF_FEATURE_TOGGLES_ENABLE=dashboardSectionVariables
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_RENDERING_RENDERER_TOKEN=${GRAFANA_RENDERER_TOKEN}
      network_mode: host
env:
  GRAFANA_RENDERER_TOKEN: test-token
  GRAFANA_ADMIN_PASSWORD: admin
commands:
- - ./prometheus-config.sh
  - -m
  - 127.0.0.1:9093
  - -G
  - localhost:3000
- - ./generate-dashboards.sh
  - -v
  - '2025.3'
  - -M
  - '3'
- - ./generate-dashboards.sh
  - -t
  - -v
  - '2025.3'
  - -M
  - '3'
- - ./grafana-datasource.sh
  - -p
  - 127.0.0.1:9090
  - -m
  - 127.0.0.1:9093
  - -L
  - 127.0.0.1:3100
files:
- loki/alloy/build/config.alloy
- loki/conf/loki-config.yaml
dirs: []
warnings:
- Without an external Prometheus directory, Prometheus data will be deleted on shutdown, use the -d command line flag for data persistence.
